name: Java CI with maven
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
       - name: Install OpenJDK 17
         run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk

       - name: Install Maven
         run: |
          sudo apt-get update
          sudo apt-get install -y maven
       - name: Build with Maven
         run: |
          mvn clean install
    
      
